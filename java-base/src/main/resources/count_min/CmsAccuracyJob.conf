# Count-Min Sketch Accuracy Characterization Configuration
#
# This configuration defines parameters for measuring CMS frequency estimation
# accuracy across different sketch widths while maintaining a constant load factor.
#
# LOAD FACTOR RATIONALE:
# The key ratio is d/w (distinct items / width):
#   - Too sparse (d/w < 0.5): Most items get dedicated buckets, errors near zero
#   - Sweet spot (d/w ~ 2-8): Meaningful collisions, min-across-rows matters
#   - Saturated (d/w > 32): Everything collides, worst-case errors throughout
#
# By setting lg_range = lg_width + 2, we achieve d/w ~ 4 (moderate collision regime)

# Profile class (for Java implementation - not yet implemented)
# JobProfile=org.apache.datasketches.characterization.count_min.CmsAccuracyProfile

# Sketch depth (number of hash functions)
# Fixed at 5 - standard choice providing good accuracy/space tradeoff
depth=5

# Width sweep parameters (power of 2)
# Widths: 256, 512, 1024, 2048, 4096
lgMinWidth=8
lgMaxWidth=12

# Load factor configuration
# lg_range = lg_width + 2 gives distinct_items = 4 * width
# This achieves d/w ~ 4 (moderate collision regime)
lgRangeOffset=2

# Stream length multiplier
# stream_length = distinct_items * streamMultiplier
# Multiplier of 16 provides good frequency range for Zipfian distribution
streamMultiplier=16

# Zipf distribution parameters
# alpha = 1.1: High skew, realistic frequency distribution
# alpha = 0.7: Lower skew, stress test for sketch
zipfExponent=1.1

# Trial parameters
# More trials at smaller widths (faster), fewer at larger widths (slower)
lgMaxTrials=14
lgMinTrials=10

# Output columns:
# width, depth, trials, distinct_items, stream_length, theoretical_max_error,
# mean_abs_error, median_abs_error, p95_abs_error, max_abs_error,
# mean_rel_error, median_rel_error, p95_rel_error, frac_exceeding_bound
#
# Theoretical error bound: epsilon * N where epsilon = e/width
# CMS guarantees: estimate <= true_freq + epsilon * N
